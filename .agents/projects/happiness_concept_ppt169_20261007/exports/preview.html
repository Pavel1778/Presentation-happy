<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>LinguaFix / Happy — preview</title>
<style>
 body{background:#111;margin:0;padding:16px;font-family:sans-serif;color:#eee}
 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
 figure{margin:0}
 img{width:100%;border:1px solid #444;display:block}
 figcaption{font-size:12px;padding:4px 0;color:#aaa}
</style></head><body>
<h2>Концепция счастья — 15 слайдов</h2>
<div class="grid" id="g"></div>
<script>
const names=["01_cover","02_goals","03_toc","04_why","05_science","06_physiology","07_history","08_hedonia","09_formula","10_factors","11_easterlin","12_education","13_digital","14_recommendations","15_conclusions"];
document.getElementById('g').innerHTML=names.map(n=>`<figure><img src="preview/${n}.png"><figcaption>${n}</figcaption></figure>`).join('');
</script>
</body></html>
