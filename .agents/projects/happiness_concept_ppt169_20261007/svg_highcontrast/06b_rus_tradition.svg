<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" lang="ru-RU" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAF2F8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EFE1C9;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p07b-photo" x="0" y="0" width="1280" height="720" href="../images/p07_history.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p07b-photo-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" fill-opacity="0.9" data-pptx-role="background"/>
  <rect id="accent" x="0" y="0" width="1280" height="6" fill="#CA6F1E" data-pptx-role="decoration"/>
  <g id="title" data-pptx-bounds="80 44 1120 92">
    <text x="80" y="106" font-size="44" font-weight="bold" fill="#154360">Счастье в русской традиции</text>
  </g>
  <g id="cards" data-pptx-bounds="80 168 1120 330">
    <rect x="80" y="168" width="540" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/quote" x="104" y="192" width="40" height="40" fill="#CA6F1E"/>
    <text x="156" y="218" font-size="22" font-weight="bold" fill="#154360">Преподобный Никон Оптинский</text>
    <text x="104" y="262" font-size="22" font-style="italic" fill="#1A1A1A">«Счастью моему нет предела, я наконец<tspan x="104" dy="32">узнал, что такое Царствие Божие внутри вас»</tspan></text>
    <rect x="660" y="168" width="540" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/sparkles" x="684" y="192" width="40" height="40" fill="#CA6F1E"/>
    <text x="736" y="218" font-size="22" font-weight="bold" fill="#154360">Мученик Евстратий</text>
    <text x="684" y="262" font-size="22" font-style="italic" fill="#1A1A1A">«Мучение это суть радость» — вера<tspan x="684" dy="32">преображает страдание в надежду</tspan></text>
    <rect x="80" y="348" width="1120" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/book-2" x="104" y="372" width="40" height="40" fill="#154360"/>
    <text x="156" y="398" font-size="22" font-weight="bold" fill="#154360">Братья Стругацкие · «Понедельник начинается в субботу»</text>
    <text x="104" y="442" font-size="22" font-style="italic" fill="#1A1A1A">«Счастье есть отсутствие несчастья» — ироничная формула советской эпохи</text>
    <text x="104" y="474" font-size="22" fill="#1A1A1A">В Томске стоит памятник счастью: счастье — культурный феномен</text>
  </g>
  <g id="note" data-pptx-bounds="80 520 1120 120">
    <rect x="80" y="520" width="1120" height="120" rx="16" fill="#CA6F1E" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/bulb" x="104" y="544" width="40" height="40" fill="#8A4A12"/>
    <text x="160" y="566" font-size="22" fill="#1A1A1A">Русская традиция ставит в центр не обладание, а состояние души:<tspan x="160" dy="36">счастье нельзя купить — его можно только воспитать в себе.</tspan></text>
  </g>
  <line id="footer-rule" x1="80" y1="684" x2="1200" y2="684" stroke="#10304A" stroke-opacity="0.12" stroke-width="1" data-pptx-role="decoration"/>
  <g id="slide-number" data-pptx-bounds="1100 690 100 28"><text x="1200" y="708" font-size="22" text-anchor="end" fill="#2C2C2C">8</text></g>
</svg>
