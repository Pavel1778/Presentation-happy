  </g>  <g id="swb-left" data-pptx-bounds="80 168 1120 210"><rect x="450" y="168" width="380" height="210" rx="16" fill="#154360" fill-opacity="0.12" />    <text x="640" y="230" font-size="26" font-weight="bold" fill="#154360" text-anchor="middle">Субъективное</text>    <text x="640" y="264" font-size="26" font-weight="bold" fill="#154360" text-anchor="middle">благополучие</text>    <text x="640" y="304" font-size="22" fill="#154360" text-anchor="middle">SWB = оценка + эмоции</text>    <text x="640" y="344" font-size="22" fill="#2C2C2C" text-anchor="middle">сумма двух компонентов</text><rect x="860" y="175" width="340" height="195" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <use data-icon="tabler-outline/heart" x="1006" y="196" width="48" height="48" fill="#A93226" />    <text x="1030" y="292" font-size="26" font-weight="bold" fill="#922B21" text-anchor="middle">Эмоции</text>    <text x="1030" y="330" font-size="22" fill="#2C2C2C" text-anchor="middle">эмоциональный компонент</text><rect x="80" y="175" width="340" height="195" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <use data-icon="tabler-outline/scale" x="226" y="196" width="48" height="48" fill="#154360" />    <text x="250" y="292" font-size="26" font-weight="bold" fill="#154360" text-anchor="middle">Оценка жизни</text>    <text x="250" y="330" font-size="22" fill="#2C2C2C" text-anchor="middle">когнитивный компонент</text>    </g><g id="appr-1" data-pptx-bounds="80 400 1120 118"><rect x="367" y="400" width="272" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <text x="503" y="452" font-size="22" font-weight="bold" fill="#154360" text-anchor="middle">Когнитивный</text>    <text x="503" y="486" font-size="22" fill="#2C2C2C" text-anchor="middle">мысли и оценки</text><rect x="654" y="400" width="272" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <text x="790" y="452" font-size="22" font-weight="bold" fill="#154360" text-anchor="middle">Позитивный</text>    <text x="790" y="486" font-size="22" fill="#2C2C2C" text-anchor="middle">сильные стороны</text><rect x="941" y="400" width="259" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <text x="1070" y="452" font-size="22" font-weight="bold" fill="#154360" text-anchor="middle">Био-психо-соц.</text>    <text x="1070" y="486" font-size="22" fill="#2C2C2C" text-anchor="middle">среда и тело</text><rect x="80" y="400" width="272" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.86" />    <text x="216" y="452" font-size="22" font-weight="bold" fill="#154360" text-anchor="middle">Психоанализ</text>    <text x="216" y="486" font-size="22" fill="#2C2C2C" text-anchor="middle">Юнг</text>    </g><g id="note" data-pptx-bounds="80 542 1120 96">    <rect x="80" y="542" width="1120" height="96" rx="16" fill="#1E8449" fill-opacity="0.12" />    <use data-icon="tabler-outline/bulb" x="108" y="566" width="40" height="40" fill="#145A32" />    <text x="164" y="588" font-size="22" fill="#1A1A1A">Теория «расширять и наращивать» (broaden-and-build):<tspan x="164" dy="31">позитивные эмоции расширяют мышление и накапливают ресурсы</tspan></text>  </g><line id="footer-rule" x1="80" y1="684" x2="1200" y2="684" stroke="#10304A" stroke-opacity="0.12" stroke-width="1" data-pptx-role="decoration" /><g id="slide-number" data-pptx-bounds="1100 690 100 28"><text x="1200" y="708" font-size="22" text-anchor="end" fill="#2C2C2C">5</text></g></svg>