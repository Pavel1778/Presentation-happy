  <image id="cover-photo" x="0" y="0" width="1280" height="720" href="../images/p01_cover.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="cover-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" fill-opacity="0.82" data-pptx-role="background"/>
  <circle id="cover-orb" cx="1100" cy="140" r="220" fill="#FFFFFF" opacity="0.35" data-pptx-role="decoration"/>
  <circle id="cover-orb-2" cx="170" cy="650" r="160" fill="#27AE60" opacity="0.08" data-pptx-role="decoration"/>

  <g id="cover-header" data-pptx-bounds="80 80 940 300">
