    <use data-icon="tabler-outline/sun" x="1040" y="500" width="52" height="52" fill="#E67E22"/>
    <use data-icon="tabler-outline/users" x="1120" y="500" width="52" height="52" fill="#27AE60"/>
    <text x="880" y="582" font-size="24" fill="#5D6D7E">мозг · сердце · солнце · семья</text>
