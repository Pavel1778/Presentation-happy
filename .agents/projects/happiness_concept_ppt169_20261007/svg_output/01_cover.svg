    <text x="112" y="500" font-size="24" fill="#5D6D7E">Группа ИС-24</text>
    <text x="112" y="538" font-size="24" fill="#5D6D7E">sabadaspaha@gmail.com</text>
    <text x="112" y="576" font-size="24" fill="#5D6D7E">Защита учебной презентации, 2026</text>
