      <text x="948" y="244" font-size="24" font-weight="bold" fill="#1B4F72">Что узнаете</text>
      <text x="884" y="300" font-size="22" fill="#2C3E50">факторы счастья</text>
      <text x="884" y="332" font-size="22" fill="#2C3E50">и восемь шагов</text>
