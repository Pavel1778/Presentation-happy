    <text x="80" y="106" font-size="48" font-weight="bold" fill="#1B4F72">О чём эта презентация</text>
  </g>

  <g id="p04-abstract" data-pptx-bounds="80 170 1120 480">
    <g id="p04-a1">
      <rect x="80" y="180" width="360" height="230" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
