      <text x="558" y="244" font-size="24" font-weight="bold" fill="#1B4F72">Подход</text>
      <text x="494" y="300" font-size="22" fill="#2C3E50">научные данные</text>
      <text x="494" y="332" font-size="22" fill="#2C3E50">и критика</text>
