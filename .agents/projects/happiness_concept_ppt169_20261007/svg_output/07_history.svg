<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p07-photo" x="0" y="0" width="1280" height="720" href="../images/p07_history.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p07-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" data-pptx-role="background" fill-opacity="0.88"/>
  <rect id="p07-accent" x="0" y="0" width="1280" height="6" fill="#E67E22" data-pptx-role="decoration"/>
  <text id="p07-num" x="1200" y="690" font-size="24" fill="#5D6D7E" text-anchor="end" data-pptx-role="page-number">07</text>

  <g id="p07-title" data-pptx-bounds="80 44 1120 92">
    <text x="80" y="106" font-size="48" font-weight="bold" fill="#1B4F72">Семь вех в понимании счастья</text>
  </g>

  <g id="p07-timeline" data-pptx-bounds="80 190 1120 230">
    <line x1="110" y1="300" x2="1160" y2="300" stroke="#1B4F72" stroke-width="4"/>
    <g id="p07-p140">
      <image x="102" y="212" width="76" height="76" href="../images/ph_aristotle.jpg" preserveAspectRatio="xMidYMid slice"/>
      <text x="140" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Аристотель</text>
      <text x="140" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">эвдемония</text>
    </g>
    <g id="p07-p300">
      <image x="262" y="212" width="76" height="76" href="../images/ph_seneca.jpg" preserveAspectRatio="xMidYMid slice"/>
      <text x="300" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Стоики</text>
      <text x="300" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">спокойствие</text>
    </g>
    <g id="p07-p460">
      <circle cx="460" cy="250" r="38" fill="#1B4F72" fill-opacity="0.12" stroke="#1B4F72" stroke-width="3"/>
      <text x="460" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Индия</text>
      <text x="460" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">освобождение</text>
    </g>
    <g id="p07-p620">
      <image x="582" y="212" width="76" height="76" href="../images/ph_aquinas.jpg" preserveAspectRatio="xMidYMid slice"/>
      <text x="620" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Фома Аквинский</text>
      <text x="620" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">недостижимо</text>
    </g>
    <g id="p07-p780">
      <image x="742" y="212" width="76" height="76" href="../images/ph_jefferson.jpg" preserveAspectRatio="xMidYMid slice"/>
      <text x="780" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Джефферсон</text>
      <text x="780" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">право на счастье</text>
    </g>
    <g id="p07-p940">
      <image x="902" y="212" width="76" height="76" href="../images/ph_bentham.jpg" preserveAspectRatio="xMidYMid slice"/>
      <text x="940" y="330" font-size="18" font-weight="bold" fill="#1B4F72" text-anchor="middle">Бентам и Милль</text>
      <text x="940" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">удовольствие</text>
    </g>
    <g id="p07-p1100">
      <circle cx="1100" cy="250" r="38" fill="#E67E22" fill-opacity="0.12" stroke="#E67E22" stroke-width="3"/>
      <text x="1100" y="330" font-size="18" font-weight="bold" fill="#E67E22" text-anchor="middle">XXI век</text>
      <text x="1100" y="362" font-size="18" fill="#2C3E50" text-anchor="middle">многомерность</text>
    </g>
  </g>

  <g id="p07-note" data-pptx-bounds="80 450 1120 90">
    <rect x="80" y="450" width="1120" height="90" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
    <use data-icon="tabler-outline/infinity" x="104" y="475" width="40" height="40" fill="#E67E22"/>
    <text x="160" y="488" font-size="24" fill="#2C3E50">Общее: счастье — не удача, а результат усилий и добродетельной жизни</text>
    <text x="160" y="522" font-size="24" fill="#5D6D7E">Сегодня наука рассматривает его как многомерный феномен</text>
  </g>
  <text id="credit" x="80" y="706" font-size="20" fill="#7F8C8D">Портреты: Wikimedia Commons — Public Domain / CC0; © Zde / Wikimedia / CC BY-SA 4.0</text>
