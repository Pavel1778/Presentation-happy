    <line x1="590" y1="296" x2="590" y2="512" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="590" y="546" font-size="24" font-weight="bold" fill="#E74C3C" text-anchor="middle">75 000 $</text>
    <text x="146" y="280" font-size="24" fill="#5D6D7E">высокое</text>
    <text x="146" y="512" font-size="24" fill="#5D6D7E">низкое</text>
