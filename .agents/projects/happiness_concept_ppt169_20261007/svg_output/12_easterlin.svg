    <line x1="150" y1="258" x2="150" y2="512" stroke="#95A5A6" stroke-width="2"/>
    <line x1="150" y1="512" x2="850" y2="512" stroke="#95A5A6" stroke-width="2"/>
    <polyline points="150,476 260,428 370,372 480,326 590,296 700,282 810,278 845,277" fill="none" stroke="#1B4F72" stroke-width="6"/>
