      <text id="p12-num" x="1200" y="690" font-size="24" fill="#5D6D7E" text-anchor="end" data-pptx-role="page-number">12</text>

  <g id="p12-title" data-pptx-bounds="80 40 1120 118">
    <text x="80" y="102" font-size="48" font-weight="bold" fill="#1B4F72">Парадокс среднего звена</text>
    <text x="80" y="144" font-size="24" fill="#5D6D7E">Связь счастья и образования нелинейна</text>
  </g>

  <g id="p12-chart" data-pptx-bounds="120 200 660 470">
    <rect x="120" y="200" width="660" height="420" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
    <line x1="180" y1="240" x2="180" y2="560" stroke="#95A5A6" stroke-width="2"/>
    <line x1="180" y1="560" x2="740" y2="560" stroke="#95A5A6" stroke-width="2"/>
    <polyline points="180,290 290,350 400,460 510,510 620,420 720,350" fill="none" stroke="#1B4F72" stroke-width="6"/>
    <circle cx="510" cy="510" r="18" fill="none" stroke="#E67E22" stroke-width="6"/>
    <text x="510" y="470" font-size="24" font-weight="bold" fill="#B9631B" text-anchor="middle">провал</text>
    <text x="172" y="260" font-size="24" fill="#5D6D7E">выше</text>
    <text x="172" y="560" font-size="24" fill="#5D6D7E">ниже</text>
    <text x="190" y="596" font-size="24" fill="#5D6D7E">среднее</text>
    <text x="600" y="596" font-size="24" fill="#5D6D7E">высшее</text>
    <text x="270" y="636" font-size="24" fill="#5D6D7E">Уровень образования → уровень счастья</text>
  </g>

  <g id="p12-list" data-pptx-bounds="820 200 380 420">
    <rect x="820" y="200" width="380" height="420" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
    <use data-icon="tabler-outline/school" x="848" y="228" width="40" height="40" fill="#1B4F72"/>
    <text x="900" y="260" font-size="24" font-weight="bold" fill="#1B4F72">Что важно</text>
    <text x="848" y="330" font-size="24" fill="#2C3E50">слабая прямая связь</text>
    <text x="848" y="382" font-size="24" fill="#2C3E50">провал у среднего</text>
    <text x="848" y="414" font-size="24" fill="#2C3E50">специального</text>
    <text x="848" y="466" font-size="24" fill="#2C3E50">косвенно: доход,</text>
    <text x="848" y="498" font-size="24" fill="#2C3E50">статус, навыки</text>
    <text x="848" y="550" font-size="24" fill="#2C3E50">завышенные ожидания</text>
  </g>
      <text id="credit" x="80" y="712" font-size="22" fill="#7F8C8D">© Kambai Akau / Wikimedia / CC BY-SA 4.0</text>
