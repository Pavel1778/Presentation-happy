<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p12-photo" x="0" y="0" width="1280" height="720" href="../images/p12_education.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p12-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" data-pptx-role="background" fill-opacity="0.88"/>
  <rect id="p12-accent" x="0" y="0" width="1280" height="6" fill="#E67E22" data-pptx-role="decoration"/>
