      <text x="288" y="292" font-size="24" font-weight="bold" fill="#2C3E50">Отношения — №1</text>
      <text x="288" y="326" font-size="22" fill="#5D6D7E">близость важнее денег</text>
    </g>
    <g id="p16-c2">
      <rect x="660" y="240" width="440" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#27AE60" stroke-width="2"/>
      <use data-icon="tabler-outline/dna" x="680" y="270" width="40" height="40" fill="#27AE60"/>
      <text x="768" y="292" font-size="24" font-weight="bold" fill="#2C3E50">Гены и действия</text>
      <text x="768" y="326" font-size="22" fill="#5D6D7E">50% + 40% = 90%</text>
    </g>
    <g id="p16-c3">
