      <use data-icon="tabler-outline/wallet" x="200" y="400" width="40" height="40" fill="#27AE60"/>
      <text x="288" y="422" font-size="24" font-weight="bold" fill="#2C3E50">Доход до порога</text>
      <text x="288" y="456" font-size="22" fill="#5D6D7E">дальше — плато</text>
    </g>
    <g id="p16-c4">
      <rect x="660" y="370" width="440" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#27AE60" stroke-width="2"/>
      <use data-icon="tabler-outline/device-mobile" x="680" y="400" width="40" height="40" fill="#27AE60"/>
      <text x="768" y="422" font-size="24" font-weight="bold" fill="#2C3E50">Цифровой баланс</text>
      <text x="768" y="456" font-size="22" fill="#5D6D7E">меньше соцсетей</text>
    </g>
    <g id="p16-c5">
      <rect x="180" y="500" width="440" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#27AE60" stroke-width="2"/>
      <use data-icon="tabler-outline/shield-check" x="200" y="530" width="40" height="40" fill="#27AE60"/>
      <text x="288" y="552" font-size="24" font-weight="bold" fill="#2C3E50">Стрессоустойчивость</text>
