      <use data-icon="tabler-outline/sparkles" x="680" y="530" width="40" height="40" fill="#27AE60"/>
      <text x="768" y="552" font-size="24" font-weight="bold" fill="#2C3E50">Счастье развивается</text>
      <text x="768" y="586" font-size="22" fill="#5D6D7E">осознанными усилиями</text>
