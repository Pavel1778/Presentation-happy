<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" data-pptx-page-role="ending">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p16-photo" x="0" y="0" width="1280" height="720" href="../images/p15_conclusions.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p16-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" data-pptx-role="background" fill-opacity="0.88"/>
  <rect id="p16-accent" x="0" y="0" width="1280" height="6" fill="#1B4F72" data-pptx-role="decoration"/>
      <text id="p16-foot" x="80" y="700" font-size="22" fill="#5D6D7E" data-pptx-role="footer">Концепция счастья · ИС-24</text>
      <text id="p16-num" x="1200" y="700" font-size="22" fill="#5D6D7E" text-anchor="end" data-pptx-role="page-number">16</text>

  <g id="p16-title" data-pptx-bounds="80 40 1120 90">
    <text x="80" y="100" font-size="48" font-weight="bold" fill="#1B4F72">Счастье = осознанные усилия</text>
  </g>

  <g id="p16-puzzle" data-pptx-bounds="140 150 1000 480">
    <rect x="140" y="150" width="1000" height="480" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
    <text x="180" y="206" font-size="24" font-weight="bold" fill="#1B4F72">Шесть главных выводов</text>

    <g id="p16-c1">
      <rect x="180" y="240" width="440" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#27AE60" stroke-width="2"/>
