<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" lang="ru-RU" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p07c-photo" x="0" y="0" width="1280" height="720" href="../images/p05_science.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p07c-photo-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" fill-opacity="0.9" data-pptx-role="background"/>
  <rect id="accent" x="0" y="0" width="1280" height="6" fill="#27AE60" data-pptx-role="decoration"/>
  <g id="title" data-pptx-bounds="80 44 1120 92">
    <text x="80" y="106" font-size="40" font-weight="bold" fill="#1B4F72">Русские учёные о счастье</text>
  </g>
  <g id="cards" data-pptx-bounds="80 168 1120 357">
    <rect x="80" y="168" width="540" height="165" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/scale" x="104" y="190" width="40" height="40" fill="#1B4F72"/>
    <text x="156" y="216" font-size="24" font-weight="bold" fill="#1B4F72">С. Л. Рубинштейн</text>
    <text x="104" y="256" font-size="22" fill="#5D6D7E">«Бытие и сознание» (1957)</text>
    <text x="104" y="292" font-size="22" fill="#2C3E50">Счастье — единство знания<tspan x="104" dy="32">и переживания, связь философии и психологии</tspan></text>
    <rect x="660" y="168" width="540" height="165" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/bulb" x="684" y="190" width="40" height="40" fill="#27AE60"/>
    <text x="736" y="216" font-size="24" font-weight="bold" fill="#1B4F72">Д. А. Леонтьев</text>
    <text x="684" y="256" font-size="22" fill="#5D6D7E">«Психология смысла» (2003)</text>
    <text x="684" y="292" font-size="22" fill="#2C3E50">Смысл жизни и жизненные<tspan x="684" dy="32">ориентации — основа благополучия</tspan></text>
    <rect x="80" y="360" width="540" height="165" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/sun" x="104" y="382" width="40" height="40" fill="#E67E22"/>
    <text x="156" y="408" font-size="24" font-weight="bold" fill="#1B4F72">И. А. Джидарьян</text>
    <text x="104" y="448" font-size="22" fill="#5D6D7E">«Психология счастья и оптимизма» (2013)</text>
    <text x="104" y="484" font-size="22" fill="#2C3E50">Оптимизм, смысл жизни<tspan x="104" dy="32">и удовлетворённость жизнью</tspan></text>
    <rect x="660" y="360" width="540" height="165" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <use data-icon="tabler-outline/heart" x="684" y="382" width="40" height="40" fill="#E74C3C"/>
    <text x="736" y="408" font-size="24" font-weight="bold" fill="#1B4F72">Л. В. Куликов</text>
    <text x="684" y="448" font-size="22" fill="#5D6D7E">«Психология настроения» (1997)</text>
    <text x="684" y="484" font-size="22" fill="#2C3E50">Настроение как фон и регулятор<tspan x="684" dy="32">субъективного благополучия</tspan></text>
  </g>
  <g id="note" data-pptx-bounds="80 548 1120 102">
    <rect x="80" y="548" width="1120" height="102" rx="16" fill="#27AE60" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/users" x="104" y="570" width="40" height="40" fill="#1E8449"/>
    <text x="160" y="592" font-size="22" fill="#2C3E50">Идею активности и потока в отечественной психологии развивали<tspan x="160" dy="34">С. Л. Рубинштейн, Л. С. Выготский и В. А. Петровский.</tspan></text>
  </g>
  <line id="footer-rule" x1="80" y1="684" x2="1200" y2="684" stroke="#1F4E79" stroke-opacity="0.12" stroke-width="1" data-pptx-role="decoration"/>
  <g id="slide-number" data-pptx-bounds="1100 690 100 28"><text x="1200" y="708" font-size="22" text-anchor="end" fill="#5D6D7E">9</text></g>
</svg>
