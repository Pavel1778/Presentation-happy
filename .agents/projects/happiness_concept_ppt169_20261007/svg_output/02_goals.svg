<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     font-family="Arial" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D3;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <image id="p02-photo" x="0" y="0" width="1280" height="720" href="../images/p02_goals.jpg" preserveAspectRatio="xMidYMid slice" data-pptx-role="background"/>
  <rect id="p02-bg" x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" data-pptx-role="background" fill-opacity="0.88"/>
  <rect id="p02-accent" x="0" y="0" width="1280" height="6" fill="#27AE60" data-pptx-role="decoration"/>
  <text id="p02-foot" x="80" y="690" font-size="24" fill="#5D6D7E" data-pptx-role="footer">Концепция счастья · ИС-24</text>
  <text id="p02-num" x="1200" y="690" font-size="24" fill="#5D6D7E" text-anchor="end" data-pptx-role="page-number">02</text>

  <g id="p02-title" data-pptx-bounds="80 44 1120 92">
    <text x="80" y="106" font-size="48" font-weight="bold" fill="#1B4F72">Цель и три задачи</text>
  </g>

  <g id="p02-goal" data-pptx-bounds="80 170 420 430">
    <rect x="80" y="170" width="420" height="430" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
    <use data-icon="tabler-outline/target" x="120" y="210" width="64" height="64" fill="#27AE60"/>
    <text x="200" y="256" font-size="24" font-weight="bold" fill="#27AE60">ЦЕЛЬ</text>
    <text x="120" y="336" font-size="24" fill="#2C3E50">Выяснить, что делает</text>
    <text x="120" y="370" font-size="24" fill="#2C3E50">людей счастливыми</text>
    <text x="120" y="404" font-size="24" fill="#2C3E50">в современном мире</text>
    <line x1="120" y1="440" x2="460" y2="440" stroke="#95A5A6" stroke-width="2"/>
    <text x="120" y="490" font-size="24" fill="#5D6D7E">Учебная презентация</text>
    <text x="120" y="524" font-size="24" fill="#5D6D7E">для защиты проекта</text>
  </g>

  <g id="p02-tasks" data-pptx-bounds="540 170 660 430">
    <g id="p02-task1">
      <rect x="540" y="170" width="660" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="600" cy="235" r="30" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="235" r="17" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="235" r="5" fill="#E67E22"/>
      <text x="600" y="244" font-size="24" font-weight="bold" fill="#E67E22" text-anchor="middle">1</text>
      <text x="660" y="228" font-size="24" font-weight="bold" fill="#1B4F72">Рассмотреть подходы</text>
      <text x="660" y="262" font-size="24" fill="#2C3E50">научные теории счастья</text>
    </g>
    <g id="p02-task2">
      <rect x="540" y="320" width="660" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="600" cy="385" r="30" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="385" r="17" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="385" r="5" fill="#E67E22"/>
      <text x="600" y="394" font-size="24" font-weight="bold" fill="#E67E22" text-anchor="middle">2</text>
      <text x="660" y="378" font-size="24" font-weight="bold" fill="#1B4F72">Выявить факторы</text>
      <text x="660" y="412" font-size="24" fill="#2C3E50">что действительно влияет</text>
    </g>
    <g id="p02-task3">
      <rect x="540" y="470" width="660" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="600" cy="535" r="30" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="535" r="17" fill="none" stroke="#E67E22" stroke-width="4"/>
      <circle cx="600" cy="535" r="5" fill="#E67E22"/>
      <text x="600" y="544" font-size="24" font-weight="bold" fill="#E67E22" text-anchor="middle">3</text>
      <text x="660" y="528" font-size="24" font-weight="bold" fill="#1B4F72">Дать рекомендации</text>
      <text x="660" y="562" font-size="24" fill="#2C3E50">практические шаги</text>
    </g>
  </g>
  <text id="credit" x="80" y="712" font-size="16" fill="#7F8C8D">© Wacky1976 / Wikimedia / CC BY-SA 4.0</text>
