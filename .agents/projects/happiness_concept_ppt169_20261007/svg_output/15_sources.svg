    <text x="104" y="420" font-size="22" font-weight="bold" fill="#1B4F72">Источники</text>
    <text x="104" y="456" font-size="20" fill="#5D6D7E">1. Apteka.ru — материалы о счастье</text>
    <text x="104" y="484" font-size="20" fill="#5D6D7E">2. Рувики, статья «Счастье»</text>
    <text x="104" y="512" font-size="20" fill="#5D6D7E">3. Журнал «Большой город»</text>
    <text x="104" y="540" font-size="20" fill="#5D6D7E">4. Портал Skillbox</text>
    <text x="104" y="568" font-size="20" fill="#5D6D7E">5. НИУ ВШЭ, исследования</text>
    <text x="104" y="596" font-size="20" fill="#5D6D7E">6. УрФУ, публикации</text>
    <text x="104" y="624" font-size="20" fill="#5D6D7E">7. Портал b17.ru</text>
    <text x="410" y="456" font-size="20" fill="#5D6D7E">8. Портал 1economic</text>
    <text x="410" y="484" font-size="20" fill="#5D6D7E">9. Cyberleninka</text>
    <text x="410" y="512" font-size="20" fill="#5D6D7E">10. РИА Новости</text>
