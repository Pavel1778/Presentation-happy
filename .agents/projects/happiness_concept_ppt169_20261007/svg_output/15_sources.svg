  <text id="p15-foot" x="80" y="694" font-size="22" fill="#5D6D7E" data-pptx-role="footer">Концепция счастья · ИС-24</text>
  <text id="p15-num" x="1200" y="694" font-size="22" fill="#5D6D7E" text-anchor="end" data-pptx-role="page-number">15</text>

  <g id="p15-title" data-pptx-bounds="80 40 1120 72">
    <text x="80" y="98" font-size="48" font-weight="bold" fill="#1B4F72">Выводы и источники</text>
  </g>

  <g id="p15-conclusions" data-pptx-bounds="80 130 1120 236">
    <rect x="80" y="130" width="1120" height="236" rx="16" fill="#FFFFFF" fill-opacity="0.86"/>
    <text x="112" y="168" font-size="22" font-weight="bold" fill="#1B4F72">Восемь главных выводов</text>
    <text x="112" y="206" font-size="20" fill="#2C3E50">1. Счастье многомерно: гены, обстоятельства, действия.</text>
    <text x="112" y="238" font-size="20" fill="#2C3E50">2. Качество отношений — сильнейший предиктор.</text>
    <text x="112" y="270" font-size="20" fill="#2C3E50">3. Деньги важны лишь до определённого уровня.</text>
    <text x="112" y="302" font-size="20" fill="#2C3E50">4. Цифровые технологии амбивалентны.</text>
    <text x="112" y="334" font-size="20" fill="#2C3E50">5. Смысл устойчивее удовольствия.</text>
    <text x="656" y="206" font-size="20" fill="#2C3E50">6. Устойчивость и здоровье — база.</text>
    <text x="656" y="238" font-size="20" fill="#2C3E50">7. Образование поддерживает благополучие.</text>
    <text x="656" y="270" font-size="20" fill="#2C3E50">8. Счастье — это навык.</text>
  </g>

